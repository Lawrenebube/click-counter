<!doctype html>

<html>
    <head>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        h1 {
            font-size: 32px;
        }
        button {
            background-color: rgb(58, 13, 13);
            color: white;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 7px;
        }
    </style>
</head>
  <body>
    <h1 id="count">0</h1>
    <button id="btnAdd">Add 1</button>
    <button id="btnSubtract">Subtract 1</button>
    <button id="reset">Reset</button>

    <script>
      // your JavaScript goes here
      let buttonAdd = document.querySelector("#btnAdd");
      let buttonSubtract = document.querySelector("#btnSubtract");
      let reset = document.querySelector("#reset");
      let heading = document.querySelector("#count");
      let count = 0;
      buttonAdd.addEventListener("click", function () {
        count += 1;
        updateDisplay();
      });
      buttonSubtract.addEventListener("click", function () {
        count -= 1;
        updateDisplay();
      });
      reset.addEventListener("click", function () {
        count = 0;
        updateDisplay();
      });
      function updateDisplay() {
        heading.textContent = count;
      }

    </script>
  </body>
</html>
